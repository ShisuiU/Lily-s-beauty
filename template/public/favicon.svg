  <rect width="32" height="32" rx="6" fill="#1B1A19"/>
  <g stroke="#C08A6B" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M16 26V11"/>
  </g>
  <g fill="#C08A6B">
    <path d="M16 12.4c3.2-.3 5-2.2 5.4-5.4-3.2.3-5 2.2-5.4 5.4Z"/>
    <path d="M16 12.4c-3.2-.3-5-2.2-5.4-5.4 3.2.3 5 2.2 5.4 5.4Z"/>
    <path d="M16 19.2c2.5-.2 3.9-1.7 4.2-4.2-2.5.2-3.9 1.7-4.2 4.2Z"/>
    <path d="M16 19.2c-2.5-.2-3.9-1.7-4.2-4.2 2.5.2 3.9 1.7 4.2 4.2Z"/>
  </g>
</svg>
