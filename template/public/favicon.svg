<!-- L'icône de l'onglet. Trente-deux pixels : ni le nom ni un logo
     détaillé n'y tiennent, seule une forme simple se reconnaît. Ici le
     rameau du gabarit, réduit à sa tige et deux feuilles, dans la
     couleur d'accent posée sur l'encre. À remplacer par la marque de
     l'institut — en gardant une forme, pas un dessin. -->
